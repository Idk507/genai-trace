[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-traces"
version = "0.1.0"
description = "Production-grade Python observability SDK for LLM and generative AI applications"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "GenAI-Traces Team"}
]
keywords = ["llm", "observability", "tracing", "ai", "genai", "openai", "anthropic", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.28.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
langchain = ["langchain>=0.1.0"]
evaluation = ["scipy>=1.10.0"]
privacy = ["presidio-analyzer>=2.2.0"]
ml-security = ["transformers>=4.30.0", "torch>=2.0.0"]
all = [
    "asyncpg>=0.28.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "scipy>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
genai-traces = "genai_traces.cli.main:cli"

[project.urls]
Homepage = "https://github.com/genai-traces/genai-traces"
Documentation = "https://genai-traces.readthedocs.io"
Repository = "https://github.com/genai-traces/genai-traces"

[tool.setuptools.packages.find]
where = ["."]
include = ["genai_traces*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
